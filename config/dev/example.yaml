# Dev backtest config (NOT live). See config/dev/README.md.
# `name` must be a registered strategy (py scripts/run_backtest.py --list-strategies).
strategy:
  name: SessionBreakoutER
  instrument: EURUSD
  pip_size: 0.0001
  timeframe_minutes: 15
  config_version: 0            # 0 = dev/unpromoted
  session: {tz: Europe/London, window_start: "13:00", window_end: "16:00", opening_range_minutes: 30, one_shot_per_side: true}
  breakout: {buffer_pips: 1.5}
  regime: {er_window: 14, er_threshold: 0.30, atr_window: 14, atr_floor_pips: 5.0, atr_ceiling_pips: 22.0, atr_low_pct: 0.20, atr_high_pct: 0.90}
  exits: {atr_mult_sl: 1.2, target_r_multiples: [1.0], partial_fractions: [1.0], move_be_after_r: null}
  blackout: {high_impact_currencies: [EUR, USD], before_min: 15, after_min: 15}
